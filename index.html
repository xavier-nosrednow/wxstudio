<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio Wanderson Santana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: tela preta, clipes em loop de ponta a ponta, texto pequeno em caixa alta. Página de clipe: player 16:9 no topo, créditos, grade de frames. */
  --bg:#050505;
  --ink:#f2f0ec;
  --muted:#8b8a86;
  --line:#1f1f1e;
  --rec:#ff3b2f;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --gutter:clamp(16px, 2.2vw, 32px);
  --gap:6px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

/* Grão de filme sobre tudo que é imagem */
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-2%)}75%{transform:translate(-2%,-4%)}100%{transform:translate(0,0)}}

/* Cabeçalho */
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:baseline;gap:24px;
  padding:18px var(--gutter);background:linear-gradient(var(--bg) 60%, transparent)}
.brand{font-stretch:75%;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:.1em;color:var(--muted);font-size:11px;margin-top:2px}
nav{display:flex;gap:clamp(14px,2.4vw,34px);flex-wrap:wrap;justify-content:flex-end}
nav button,nav a{font-stretch:75%;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:color .2s}
nav button:hover,nav a:hover,nav .on{color:var(--ink)}

/* Home: grade de clipes */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);padding:0 var(--gap)}
.tile{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;display:block}
.tile.wide{grid-column:1 / -1;aspect-ratio:2.2/1}
.tile canvas,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.02);transition:transform 1.2s cubic-bezier(.2,.7,.2,1), filter .5s;filter:brightness(.82) saturate(.95)}
.tile:hover canvas,.tile:hover video,.tile:focus-visible canvas{transform:scale(1.06);filter:brightness(1) saturate(1.05)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  background:linear-gradient(transparent, rgba(0,0,0,.55));opacity:0;transform:translateY(6px);transition:opacity .35s, transform .35s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1;transform:none}
@media (hover:none){.cap{opacity:1;transform:none}}
.cap .who{font-stretch:75%;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#d9d6cf}
.cap .what{font-size:clamp(20px,2.4vw,34px);font-weight:500;letter-spacing:-.01em;line-height:1.05;margin-top:4px;text-wrap:balance}
.cap .meta{font-family:var(--mono);font-size:11px;color:#cfccc5;white-space:nowrap}
.empty{padding:80px var(--gutter);color:var(--muted)}

/* Contato */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);padding:clamp(64px,10vw,140px) var(--gutter) 40px;border-top:1px solid var(--line);margin-top:clamp(48px,8vw,96px)}
.contact h2{font-size:clamp(30px,5vw,72px);font-weight:400;font-stretch:80%;line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-content:end;font-size:14px}
.contact dt{font-stretch:75%;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.contact dd a{border-bottom:1px solid var(--line)}
.contact dd a:hover{border-color:var(--ink)}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px var(--gutter) 32px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-stretch:75%}

/* Página do clipe */
.clip{padding:0 var(--gutter)}
.back{display:inline-flex;gap:8px;font-stretch:75%;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 18px}
.back:hover{color:var(--ink)}
.player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.player canvas,.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.pctl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.player.playing .pctl{opacity:0}
.player.playing:hover .pctl{opacity:1}
.pbtn{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:grid;place-items:center;backdrop-filter:blur(6px);background:rgba(0,0,0,.18)}
.pbtn svg{width:22px;height:22px;fill:#fff}
.hud{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:#e9e6df;pointer-events:none}
.hud .bar{flex:1;height:2px;background:rgba(255,255,255,.22)}
.hud .bar i{display:block;height:100%;width:0;background:#fff}
.hud .dot{width:7px;height:7px;border-radius:50%;background:var(--rec);opacity:0}
.player.playing .hud .dot{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.note{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.6);pointer-events:none}

.info{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--gutter);padding:clamp(28px,4vw,56px) 0 clamp(36px,5vw,72px);border-bottom:1px solid var(--line)}
.info .who{font-stretch:75%;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.info h1{font-size:clamp(40px,7vw,104px);font-weight:400;font-stretch:80%;line-height:.92;letter-spacing:-.03em;margin-top:8px;text-wrap:balance}
.info p{color:#bdbab3;max-width:52ch;margin-top:20px}
.credits{display:grid;grid-template-columns:auto 1fr;gap:9px 28px;align-content:start;font-size:14px;padding-top:6px}
.credits dt{font-stretch:75%;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}

.frames-h{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0 16px;font-stretch:75%;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.frames{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.frame{margin:0}
.frame.full{grid-column:1 / -1}
.frame .img{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.frame.full .img{aspect-ratio:2.39/1}
.frame canvas,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame figcaption{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:8px 0 14px;font-variant-numeric:tabular-nums}

.next{display:grid;grid-template-columns:1fr 1.4fr;gap:var(--gutter);align-items:end;margin-top:clamp(48px,7vw,96px);padding-top:28px;border-top:1px solid var(--line)}
.next .lbl{font-stretch:75%;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.next .t{font-size:clamp(28px,4.4vw,60px);font-stretch:80%;line-height:.95;letter-spacing:-.02em;margin-top:10px}
.next .tile{aspect-ratio:21/9}
.next:hover .t{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .tile.wide{aspect-ratio:16/9}
  .contact,.info,.next{grid-template-columns:1fr}
  .frames{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start;gap:12px}
  nav{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .grain{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="#" data-home>Wanderson Santana<small>Editor de vídeo e colorista</small></a>
  <nav id="nav" aria-label="Categorias"></nav>
</header>
<main id="app"></main>

<script>
/* ==============================================================
   SEUS PROJETOS — edite aqui.
   - preview: MP4 curto em loop (5–10 s, sem som) para a grade da home
   - embed:   link do Vimeo ou YouTube para o vídeo completo
   - stills:  URLs dos frames (JPG/WebP) com o timecode de cada um
   Enquanto esses campos estiverem vazios, a página mostra uma
   prévia gerada com a paleta de cor de cada projeto.
   ============================================================== */
const CATEGORIES = [
  {id:"todos", label:"Todos"},
  {id:"videoclipes", label:"Videoclipes"},
  {id:"comerciais", label:"Comerciais"},
  {id:"curtas", label:"Curtas"}
];

const PROJECTS = [
  {slug:"mare-alta", artist:"Lua Ferraz", title:"Maré Alta", cat:"videoclipes", year:2026, dur:"03:41",
   about:"Videoclipe filmado na última hora de luz. Montagem no ritmo da maré e cor puxada para o laranja de fim de tarde contra sombras azuis.",
   credits:[["Direção","Marina Costa"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Fotografia","Rafael Nunes"],["Produtora","Farol Filmes"]],
   look:{mode:"horizon", c:["#0b1320","#1f4e6b","#e0865a","#ffd7a0"]}, wide:true,
   preview:"", embed:"", stills:[]},
  {slug:"noite-de-neon", artist:"Bruma", title:"Noite de Neon", cat:"videoclipes", year:2026, dur:"02:58",
   about:"Corte rápido, luz prática de neon e pretos profundos. Grade com magenta e azul separados por canal.",
   credits:[["Direção","Caio Prado"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Produtora","Estúdio Lumen"]],
   look:{mode:"neon", c:["#07040d","#ff2e88","#3d5afe","#b388ff"]}, preview:"", embed:"", stills:[]},
  {slug:"feito-a-mao", artist:"Atlas Marcenaria", title:"Feito à Mão", cat:"comerciais", year:2025, dur:"00:30",
   about:"Filme de 30 s para marcenaria autoral. Planos de detalhe em madeira e luz quente de janela.",
   credits:[["Direção","Helena Duarte"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Agência","Norte Criativo"]],
   look:{mode:"blobs", c:["#140e0a","#8a5a3b","#d9a873","#f3e3c7"]}, preview:"", embed:"", stills:[]},
  {slug:"ladeira", artist:"Teo Alvim", title:"Ladeira", cat:"videoclipes", year:2025, dur:"04:12",
   about:"Plano-sequência noturno de carro descendo a cidade. Faróis viram transições.",
   credits:[["Direção","Teo Alvim"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Fotografia","Bia Lemos"]],
   look:{mode:"streak", c:["#06070b","#ff6a3d","#ffd166","#4cc9f0"]}, preview:"", embed:"", stills:[]},
  {slug:"o-ultimo-verao", artist:"Curta-metragem", title:"O Último Verão", cat:"curtas", year:2025, dur:"14:20",
   about:"Ficção de 14 minutos em 2.39:1. Cor inspirada em película de baixa saturação com realces quentes.",
   credits:[["Direção","Lucas Viana"],["Roteiro","Lucas Viana"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Som","Ana Reis"]],
   look:{mode:"horizon", c:["#120c08","#6b2f1f","#f2a65a","#fff1cf"], scope:true}, wide:true, preview:"", embed:"", stills:[]},
  {slug:"corrida-noturna", artist:"Pulso Esportes", title:"Corrida Noturna", cat:"comerciais", year:2026, dur:"00:45",
   about:"Campanha de tênis de corrida. Ritmo marcado pela batida e rastros de luz em longa exposição.",
   credits:[["Direção","Renato Sá"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"],["Agência","Faixa Azul"]],
   look:{mode:"streak", c:["#03060c","#2ec4ff","#ff3b3b","#ffffff"]}, preview:"", embed:"", stills:[]},
  {slug:"sal", artist:"Coletivo Vento", title:"Sal", cat:"videoclipes", year:2024, dur:"03:05",
   about:"Clipe de praia em dia nublado. Verdes-água lavados e pele preservada.",
   credits:[["Direção","Júlia Mota"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"]],
   look:{mode:"blobs", c:["#06100f","#1b6f6a","#8fd3c7","#e8f6f2"]}, preview:"", embed:"", stills:[]},
  {slug:"casa-vazia", artist:"Curta-metragem", title:"Casa Vazia", cat:"curtas", year:2024, dur:"11:48",
   about:"Drama em uma única locação. Paleta fria e dessaturada, com o único calor vindo dos abajures.",
   credits:[["Direção","Pedro Assis"],["Montagem","Wanderson Santana"],["Cor","Wanderson Santana"]],
   look:{mode:"neon", c:["#0a0a0a","#5b6770","#a3a9ad","#d9c7a3"], scope:true}, preview:"", embed:"", stills:[]}
];

const CONTACT = {email:"wandersonxsantana@gmail.com", instagram:"@wandersonsantana", cidade:"Brasil — trabalho remoto"};

/* ==============================================================
   Gerador de prévias (usado só enquanto não há vídeo/frames)
   ============================================================== */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

function drawScene(ctx,w,h,look,t){
  const [bg,a,b,c]=look.c; const m=look.mode;
  ctx.globalCompositeOperation="source-over";
  let g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,bg); g.addColorStop(1,"#000"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  if(m==="horizon"){
    const hy=h*(.62+.015*Math.sin(t*.4));
    g=ctx.createLinearGradient(0,0,0,hy); g.addColorStop(0,hexA(a,.9)); g.addColorStop(.75,hexA(b,.85)); g.addColorStop(1,hexA(c,.95));
    ctx.fillStyle=g; ctx.fillRect(0,0,w,hy);
    const sx=w*(.5+.18*Math.sin(t*.12)), sy=hy-h*.06;
    ctx.globalCompositeOperation="lighter";
    g=ctx.createRadialGradient(sx,sy,0,sx,sy,h*.55); g.addColorStop(0,hexA(c,.95)); g.addColorStop(.12,hexA(c,.6)); g.addColorStop(1,hexA(b,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation="source-over";
    g=ctx.createLinearGradient(0,hy,0,h); g.addColorStop(0,hexA(a,.95)); g.addColorStop(1,bg); ctx.fillStyle=g; ctx.fillRect(0,hy,w,h-hy);
    ctx.globalCompositeOperation="lighter";
    for(let i=0;i<26;i++){
      const y=hy+(i/26)**1.6*(h-hy); const len=w*(.05+.25*(1-i/26))*(.6+.4*Math.sin(t*1.3+i*1.7));
      ctx.fillStyle=hexA(c,.22*(1-i/26)); ctx.fillRect(sx-len/2+Math.sin(t*2+i)*8,y,len,Math.max(1,h*.004));
    }
  } else if(m==="neon"){
    ctx.globalCompositeOperation="lighter";
    const cols=[a,b,c,a,b];
    for(let i=0;i<5;i++){
      const x=w*((i+.5)/5)+Math.sin(t*.35+i*2.1)*w*.07, bw=w*(.05+.04*Math.sin(t*.8+i));
      const flick=.55+.45*Math.max(0,Math.sin(t*(1.1+i*.37)+i*5));
      g=ctx.createLinearGradient(x-bw*3,0,x+bw*3,0);
      g.addColorStop(0,hexA(cols[i],0)); g.addColorStop(.5,hexA(cols[i],.55*flick)); g.addColorStop(1,hexA(cols[i],0));
      ctx.fillStyle=g; ctx.fillRect(x-bw*3,0,bw*6,h);
      ctx.fillStyle=hexA("#ffffff",.25*flick); ctx.fillRect(x-1,h*.08,2,h*.84);
    }
    g=ctx.createRadialGradient(w*.5,h*1.1,0,w*.5,h*1.1,h*.9); g.addColorStop(0,hexA(c,.35)); g.addColorStop(1,hexA(c,0)); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  } else if(m==="streak"){
    ctx.globalCompositeOperation="lighter";
    for(let i=0;i<14;i++){
      const sp=.08+((i*37)%11)/60, y=h*(.3+((i*53)%40)/100), col=[a,b,c][i%3];
      const x=((t*sp*w*(i%2?1:-1)+i*w*.37)%(w*1.6)+w*1.6)%(w*1.6)-w*.3, len=w*(.2+((i*17)%10)/25);
      g=ctx.createLinearGradient(x-len,0,x,0); g.addColorStop(0,hexA(col,0)); g.addColorStop(1,hexA(col,.75));
      ctx.fillStyle=g; ctx.fillRect(x-len,y,len,Math.max(1.5,h*.01));
      const r=h*.08; const rg=ctx.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,hexA(col,.6)); rg.addColorStop(1,hexA(col,0));
      ctx.fillStyle=rg; ctx.fillRect(x-r,y-r,r*2,r*2);
    }
    g=ctx.createLinearGradient(0,h*.62,0,h); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,hexA(a,.18)); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  } else {
    ctx.globalCompositeOperation="lighter";
    const cols=[a,b,c,b];
    for(let i=0;i<4;i++){
      const x=w*(.5+.32*Math.sin(t*(.13+i*.05)+i*1.9)), y=h*(.5+.3*Math.cos(t*(.11+i*.04)+i*2.7)), r=h*(.55+.15*Math.sin(t*.3+i));
      g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(cols[i],i===2?.45:.6)); g.addColorStop(1,hexA(cols[i],0));
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(0,0,0,.35)";
    const bx=w*(.62+.03*Math.sin(t*.2)); ctx.fillRect(bx,0,w*.012,h); ctx.fillRect(0,h*.78,w,h*.01);
  }
  ctx.globalCompositeOperation="source-over";
  g=ctx.createRadialGradient(w/2,h/2,h*.35,w/2,h/2,w*.72); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.7)");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  if(look.scope){const bar=(h-w/2.39)/2; ctx.fillStyle="#000"; ctx.fillRect(0,0,w,bar); ctx.fillRect(0,h-bar,w,bar);}
}

/* Loop único de animação; só desenha o que está visível */
const live=new Set();
const io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target._scene; if(s) s.visible=e.isIntersecting}),{rootMargin:"100px"});
function scene(canvas,look,opts={}){
  const s={canvas,ctx:canvas.getContext("2d"),look,t:opts.t??Math.random()*40,playing:opts.autoplay!==false&&!reduce,visible:true,onTick:opts.onTick};
  canvas._scene=s; drawScene(s.ctx,canvas.width,canvas.height,look,s.t);
  if(!opts.still){live.add(s); io.observe(canvas);}
  return s;
}
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  for(const s of live){
    if(!s.canvas.isConnected){live.delete(s); io.unobserve(s.canvas); continue}
    if(s.playing&&s.visible){s.t+=dt; drawScene(s.ctx,s.canvas.width,s.canvas.height,s.look,s.t); s.onTick&&s.onTick(s)}
  }
  requestAnimationFrame(loop);
})(last);

function tc(sec){const f=Math.floor(sec*24)%24, s=Math.floor(sec)%60, m=Math.floor(sec/60)%60, h=Math.floor(sec/3600);return [h,m,s,f].map(n=>String(n).padStart(2,"0")).join(":")}
function durSec(d){const [m,s]=d.split(":").map(Number);return m*60+s}

/* ==============================================================
   Views
   ============================================================== */
const app=document.getElementById("app"), nav=document.getElementById("nav");
let filter="todos";

function renderNav(){
  nav.innerHTML="";
  CATEGORIES.forEach(c=>{
    const b=document.createElement("button"); b.textContent=c.label; b.type="button";
    if(c.id===filter && !location.hash.slice(1)) b.classList.add("on");
    b.onclick=()=>{filter=c.id; if(location.hash){history.pushState(null,"",location.pathname+location.search); route()} else {renderHome(); renderNav()} window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})};
    nav.appendChild(b);
  });
  const ct=document.createElement("button"); ct.type="button"; ct.textContent="Contato";
  ct.onclick=()=>{const go=()=>document.getElementById("contato")?.scrollIntoView({behavior:reduce?"auto":"smooth"}); if(location.hash){history.pushState(null,"",location.pathname+location.search); route(); requestAnimationFrame(go)} else go()};
  nav.appendChild(ct);
}

function tile(p,{wide=false}={}){
  const a=document.createElement("a"); a.className="tile"+(wide?" wide":""); a.href="#"+p.slug;
  a.setAttribute("aria-label",`${p.artist}, ${p.title}`);
  if(p.preview){
    const v=document.createElement("video"); Object.assign(v,{src:p.preview,muted:true,loop:true,playsInline:true,autoplay:!reduce}); v.setAttribute("muted",""); a.appendChild(v);
  } else {
    const c=document.createElement("canvas"); c.width=wide?640:480; c.height=wide?Math.round(640/2.2):270; a.appendChild(c); scene(c,p.look);
  }
  a.insertAdjacentHTML("beforeend",`<div class="grain"></div><div class="cap"><div><div class="who">${p.artist}</div><div class="what">${p.title}</div></div><div class="meta">${p.year}</div></div>`);
  return a;
}

function renderHome(){
  document.title="Portfólio Wanderson Santana";
  const list=PROJECTS.filter(p=>filter==="todos"||p.cat===filter);
  app.innerHTML="";
  const g=document.createElement("section"); g.className="grid"; g.setAttribute("aria-label","Projetos");
  // Itens "wide" ocupam a linha inteira; garante que os demais fechem em pares
  let open=0;
  list.forEach(p=>{const w=!!p.wide && open%2===0; g.appendChild(tile(p,{wide:w})); if(!w) open++;});
  if(!list.length) g.innerHTML=`<p class="empty">Nenhum projeto nesta categoria ainda.</p>`;
  app.appendChild(g);
  app.insertAdjacentHTML("beforeend",`
    <section class="contact" id="contato">
      <h2>Montagem e cor para videoclipes, marcas e cinema.</h2>
      <dl>
        <dt>E-mail</dt><dd><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></dd>
        <dt>Instagram</dt><dd>${CONTACT.instagram}</dd>
        <dt>Base</dt><dd>${CONTACT.cidade}</dd>
        <dt>Ferramentas</dt><dd>DaVinci Resolve, Premiere Pro, After Effects</dd>
      </dl>
    </section>
    <footer><span>© ${new Date().getFullYear()} Wanderson Santana</span><span>${CONTACT.email}</span></footer>`);
}

function playerFor(p){
  const wrap=document.createElement("div"); wrap.className="player";
  if(p.embed){
    let src=p.embed; const vm=src.match(/vimeo\.com\/(\d+)/), yt=src.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
    if(vm) src=`https://player.vimeo.com/video/${vm[1]}?title=0&byline=0&portrait=0`;
    if(yt) src=`https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0`;
    wrap.innerHTML=`<iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${p.artist} – ${p.title}"></iframe>`;
    return wrap;
  }
  const c=document.createElement("canvas"); c.width=1280; c.height=720; wrap.appendChild(c);
  const total=durSec(p.dur);
  wrap.insertAdjacentHTML("beforeend",`<div class="grain"></div>
    <span class="note">PRÉVIA · substitua pelo link do Vimeo em "embed"</span>
    <div class="hud"><span class="dot"></span><span class="tc">00:00:00:00</span><span class="bar"><i></i></span><span>${p.dur}</span></div>
    <div class="pctl"><button class="pbtn" type="button" aria-label="Reproduzir"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button></div>`);
  const tcEl=wrap.querySelector(".tc"), bar=wrap.querySelector(".bar i"), btn=wrap.querySelector(".pbtn");
  let el=0;
  const s=scene(c,p.look,{autoplay:false,t:3,onTick:()=>{el=(el+1/60)%total; tcEl.textContent=tc(el); bar.style.width=(el/total*100)+"%"}});
  const play='<path d="M7 4.5v15l13-7.5z"/>', pause='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  btn.onclick=()=>{s.playing=!s.playing; wrap.classList.toggle("playing",s.playing); btn.querySelector("svg").innerHTML=s.playing?pause:play; btn.setAttribute("aria-label",s.playing?"Pausar":"Reproduzir")};
  return wrap;
}

function renderClip(p){
  document.title=`${p.title} · ${p.artist}`;
  const i=PROJECTS.indexOf(p), nx=PROJECTS[(i+1)%PROJECTS.length];
  app.innerHTML="";
  const sec=document.createElement("article"); sec.className="clip";
  sec.innerHTML=`<a class="back" href="#" data-home>← Todos os projetos</a>`;
  sec.appendChild(playerFor(p));
  sec.insertAdjacentHTML("beforeend",`
    <div class="info">
      <div><div class="who">${p.artist}</div><h1>${p.title}</h1><p>${p.about}</p></div>
      <dl class="credits">${p.credits.map(([r,n])=>`<dt>${r}</dt><dd>${n}</dd>`).join("")}<dt>Ano</dt><dd>${p.year}</dd><dt>Duração</dt><dd>${p.dur}</dd></dl>
    </div>
    <div class="frames-h"><span>Frames</span><span>${p.look.scope?"2.39:1":"16:9"} · 24 fps</span></div>`);
  const fr=document.createElement("div"); fr.className="frames";
  const total=durSec(p.dur);
  const stills=p.stills.length? p.stills.map(s=>typeof s==="string"?{src:s}:s)
    : Array.from({length:7},(_,k)=>({t:4+k*5.3}));
  stills.forEach((s,k)=>{
    const full=k%3===0; const f=document.createElement("figure"); f.className="frame"+(full?" full":"");
    const box=document.createElement("div"); box.className="img";
    if(s.src){const im=document.createElement("img"); im.src=s.src; im.loading="lazy"; im.alt=`Frame ${k+1} de ${p.title}`; box.appendChild(im)}
    else{const c=document.createElement("canvas"); c.width=full?1280:960; c.height=full?Math.round(1280/2.39):540; c.setAttribute("role","img"); c.setAttribute("aria-label",`Frame ${k+1} de ${p.title}`); box.appendChild(c); scene(c,{...p.look,scope:false},{still:true,t:s.t})}
    box.insertAdjacentHTML("beforeend",`<div class="grain" style="animation:none"></div>`);
    const at=s.tc|| tc(total*(k+1)/(stills.length+1));
    f.appendChild(box); f.insertAdjacentHTML("beforeend",`<figcaption>${String(k+1).padStart(2,"0")} · TC ${at}</figcaption>`);
    fr.appendChild(f);
  });
  sec.appendChild(fr);
  const n=document.createElement("a"); n.className="next"; n.href="#"+nx.slug;
  n.innerHTML=`<div><div class="lbl">Próximo projeto →</div><div class="t">${nx.title}</div><div class="lbl" style="margin-top:8px">${nx.artist}</div></div>`;
  const tl=tile(nx); tl.removeAttribute("href"); const wrapT=document.createElement("div"); wrapT.className="tile"; wrapT.style.aspectRatio="21/9"; wrapT.append(...tl.childNodes); wrapT.querySelector(".cap")?.remove();
  n.appendChild(wrapT); sec.appendChild(n);
  app.appendChild(sec);
  app.insertAdjacentHTML("beforeend",`<footer style="margin-top:56px"><span>© ${new Date().getFullYear()} Wanderson Santana</span><span>${CONTACT.email}</span></footer>`);
}

function route(){
  const slug=location.hash.slice(1); const p=PROJECTS.find(x=>x.slug===slug);
  if(p){renderClip(p); window.scrollTo(0,0)} else renderHome();
  renderNav();
}
document.addEventListener("click",e=>{const h=e.target.closest("[data-home]"); if(h){e.preventDefault(); history.pushState(null,"",location.pathname+location.search); route(); window.scrollTo(0,0)}});
addEventListener("hashchange",route); addEventListener("popstate",route);
route();
</script>
</body>
</html>
